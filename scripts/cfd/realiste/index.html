<!doctype html><html><head><meta charset="utf-8">
<!-- Realistic render of the detailed Rhino maquette (materials, textures, furniture) with CFD overlays.
     Driven by render.mjs: window.frame(spec) where spec = {sector, cam, tgt, fov, ground, particles, tubes, t, hud...} -->
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'DejaVu Sans',sans-serif}
#hud{position:absolute;left:28px;top:22px;color:#fff;text-shadow:0 1px 5px #000;max-width:1300px}
#t1{font:700 32px 'DejaVu Sans'} #t2{font:18px 'DejaVu Sans';margin-top:6px} #t3{font:14px 'DejaVu Sans Mono';margin-top:8px;white-space:pre;color:#eceff1}
#leg{position:absolute;right:30px;bottom:96px;width:430px;background:rgba(0,0,0,.55);padding:10px 14px;color:#fff;font:13px 'DejaVu Sans';display:none}
#bar{height:16px;margin:6px 0 3px 0} #ticks{display:flex;justify-content:space-between;font:12px 'DejaVu Sans Mono'}
#tag{position:absolute;left:28px;bottom:96px;background:rgba(0,0,0,.5);color:#fff;padding:7px 12px;font:13px 'DejaVu Sans';max-width:1000px}
#sub{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#fff;font:600 27px 'DejaVu Sans';text-shadow:0 0 6px #000,0 0 3px #000;padding:0 120px}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script></head><body>
<div id="hud"><div id="t1"></div><div id="t2"></div><div id="t3"></div></div>
<div id="leg"><div id="legt">Vitesse du vent calculée à 2 m du sol, U / Uref</div><div id="bar"></div><div id="ticks"></div><div id="legm"></div></div>
<div id="tag"></div><div id="sub"></div>
<script type="module">
import * as THREE from 'three';
const W = 1920, H = 1080;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.0; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(r.domElement);
const M = await (await fetch('materials.json')).json();
const CFG = await (await fetch('config.json')).json();          // {sid, uref, dir, solver, cells, sectors:[...]}
const jet = t => { t = Math.min(1, Math.max(0, t)); return new THREE.Color(Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 3))),
  Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 2))), Math.min(1, Math.max(0, 1.5 - Math.abs(4 * t - 1)))); };
const VMAX = 1.6;
document.getElementById('bar').style.background = 'linear-gradient(90deg,' + [...Array(11).keys()].map(i => '#' + jet(i / 10).getHexString()).join(',') + ')';
document.getElementById('ticks').innerHTML = [0, 0.4, 0.8, 1.2, 1.6].map(v => `<span>${v.toFixed(1)}</span>`).join('');
async function bin(u, T = Float32Array) { const r_ = await fetch(u); if (!r_.ok) return null; return new T(await r_.arrayBuffer()); }
const loader = new THREE.TextureLoader(); const texCache = {};
function material(i) {
  const m = M.materials[i]; const c = new THREE.Color(`rgb(${m.diffuse.join(',')})`);
  const p = { color: c, roughness: 0.92, metalness: 0.0, side: THREE.DoubleSide };
  if (m.texture) { if (!texCache[m.texture]) { const t = loader.load('textures/' + m.texture); t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; texCache[m.texture] = t; } p.map = texCache[m.texture]; p.color = new THREE.Color(0xffffff); }
  if (/Verre/.test(m.name)) { p.roughness = 0.1; p.metalness = 0.3; }
  if (/Metal|Luminaire/.test(m.name)) { p.roughness = 0.5; p.metalness = 0.6; }
  return new THREE.MeshStandardMaterial(p);
}
function geomUV(a) { const n = a.length / 5, pos = new Float32Array(3 * n), uv = new Float32Array(2 * n);
  for (let i = 0; i < n; i++) { pos.set([a[5 * i], a[5 * i + 1], a[5 * i + 2]], 3 * i); uv.set([a[5 * i + 3], a[5 * i + 4]], 2 * i); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.computeVertexNormals(); return g; }
const scenes = {};
async function build(k) {
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0x9cc3e4); sc.fog = new THREE.Fog(0xb9d3ea, 1400, 4800);
  sc.add(new THREE.HemisphereLight(0xdfefff, 0x8a7f6a, 0.9));
  const sun = new THREE.DirectionalLight(0xfff3df, 2.6);           // July afternoon, Oran (az ~250 deg, elevation ~50 deg)
  sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
  sc.add(sun); sc.add(sun.target); sc.userData.sun = sun;
  const ter = await bin(`${k}_terrain.bin`); let m_ = new THREE.Mesh(geomUV(ter), material(12)); m_.receiveShadow = true; sc.add(m_);
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000), new THREE.MeshStandardMaterial({ color: 0x2f6b8f, roughness: 0.25, metalness: 0.1 }));
  sea.rotation.x = -Math.PI / 2; sea.position.y = 0.2; sc.add(sea);
  for (const [mi] of Object.entries(M.sectors[k].materials)) {
    const a = await bin(`${k}_mat${mi}.bin`); if (!a) continue;
    m_ = new THREE.Mesh(geomUV(a), material(+mi)); m_.receiveShadow = true; m_.castShadow = +mi === 6; sc.add(m_);
  }
  const b = await bin(`${k}_bld.bin`); let g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(b, 3)); g.computeVertexNormals();
  m_ = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xf1ede4, roughness: 0.85, side: THREE.DoubleSide })); m_.castShadow = m_.receiveShadow = true; sc.add(m_);
  for (const [d, n] of Object.entries(M.sectors[k].instances)) {
    const blk = M.blocks[d]; if (!blk) continue; const mats = await bin(`${k}_inst_${d}.bin`); const cnt = mats.length / 16;
    for (const p of blk.parts) { const a = await bin(p.file); const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.BufferAttribute(a, 3)); gg.computeVertexNormals();
      const im = new THREE.InstancedMesh(gg, material(p.mat), cnt); const mm = new THREE.Matrix4();
      for (let i = 0; i < cnt; i++) { mm.fromArray(mats, 16 * i); im.setMatrixAt(i, mm); }
      im.castShadow = true; im.receiveShadow = true; sc.add(im); }
  }
  // CFD overlays
  const q = await bin(`cfd/${k}_ped.bin`), qi = await bin(`cfd/${k}_ped_idx.bin`, Uint32Array);
  if (q) { const n = q.length / 4, pp = new Float32Array(3 * n), cc = new Float32Array(3 * n);
    for (let i = 0; i < n; i++) { pp.set([q[4 * i], q[4 * i + 1] + 0.25, q[4 * i + 2]], 3 * i); const c = jet(q[4 * i + 3] / VMAX); cc.set([c.r, c.g, c.b], 3 * i); }
    g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pp, 3)); g.setAttribute('color', new THREE.BufferAttribute(cc, 3)); g.setIndex(new THREE.BufferAttribute(qi, 1));
    const gm = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.6, depthWrite: false, side: THREE.DoubleSide }));
    gm.renderOrder = 2; sc.add(gm); sc.userData.ground = gm; }
  const s = await bin(`cfd/${k}_sl.bin`); const lines = [];
  if (s) { let pos = 0; while (pos < s.length) { const m = s[pos], hi = s[pos + 1] > 0.5; const P = [], U = [];
      for (let j = 1; j <= m; j++) { const o = pos + 4 * j; P.push(new THREE.Vector3(s[o], s[o + 2], -s[o + 1])); U.push(s[o + 3]); }
      pos += 4 * (m + 1); if (P.length < 3) continue; const L = [0]; for (let j = 1; j < P.length; j++) L.push(L[j - 1] + P[j].distanceTo(P[j - 1]));
      lines.push({ P, U, L, hi }); } }
  const NP = 14; const pg = new THREE.SphereGeometry(1.1, 10, 8);
  const parts = new THREE.InstancedMesh(pg, new THREE.MeshBasicMaterial({ toneMapped: false }), Math.max(1, lines.length * NP));
  parts.renderOrder = 3; sc.add(parts); sc.userData.parts = parts; sc.userData.lines = lines;
  const tubes = new THREE.Group();
  for (const l of lines) { const curve = new THREE.CatmullRomCurve3(l.P); const seg = Math.min(300, l.P.length * 2);
    const tg = new THREE.TubeGeometry(curve, seg, 0.45, 6, false); const col = new Float32Array(tg.attributes.position.count * 3);
    for (let a = 0; a <= seg; a++) { const c = jet(l.U[Math.min(l.U.length - 1, Math.round(a / seg * (l.U.length - 1)))] / VMAX);
      for (let b2 = 0; b2 <= 6; b2++) { const v = a * 7 + b2; col.set([c.r, c.g, c.b], 3 * v); } }
    tg.setAttribute('color', new THREE.BufferAttribute(col, 3));
    tubes.add(new THREE.Mesh(tg, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55, toneMapped: false }))); }
  sc.add(tubes); sc.userData.tubes = tubes;
  return sc;
}
for (const k of CFG.sectors) scenes[k] = await build(k);
const cam = new THREE.PerspectiveCamera(50, W / H, 0.3, 30000);
const $ = id => document.getElementById(id);
window.frame = (f) => {
  const sc = scenes[f.sector]; cam.fov = f.fov || 50; cam.updateProjectionMatrix();
  cam.position.set(...f.cam); cam.lookAt(...f.tgt);
  const sun = sc.userData.sun, T = new THREE.Vector3(...f.tgt);
  sun.position.set(T.x - 520, T.y + 700, T.z - 300); sun.target.position.copy(T);
  const R = Math.min(1600, Math.max(250, cam.position.distanceTo(T) * 1.1)); const s_ = sun.shadow.camera;
  s_.left = -R; s_.right = R; s_.top = R; s_.bottom = -R; s_.near = 10; s_.far = 3000; s_.updateProjectionMatrix();
  if (sc.userData.ground) { sc.userData.ground.visible = (f.ground || 0) > 0; sc.userData.ground.material.opacity = f.ground || 0; }
  sc.userData.tubes.visible = !!f.tubes;
  const parts = sc.userData.parts; parts.visible = !!f.particles; const mm = new THREE.Matrix4();
  if (f.particles) { let i = 0; const t = f.t || 0;
    for (const l of sc.userData.lines) { if (f.lowOnly && l.hi) { for (let j = 0; j < 14; j++) { mm.makeScale(0, 0, 0); parts.setMatrixAt(i++, mm); } continue; }
      const Ltot = l.L[l.L.length - 1];
      for (let j = 0; j < 14; j++) { const sp = (j / 14 * Ltot + t * 3.0 * f.uref * 2.0) % Ltot;   // particle speed ~ local wind (x2 for readability)
        let a = 1; while (a < l.L.length - 1 && l.L[a] < sp) a++;
        const w = (sp - l.L[a - 1]) / Math.max(1e-6, l.L[a] - l.L[a - 1]); const p = l.P[a - 1].clone().lerp(l.P[a], w);
        mm.makeTranslation(p.x, p.y, p.z); parts.setMatrixAt(i, mm); parts.setColorAt(i, jet(l.U[a] / VMAX)); i++; } }
    parts.instanceMatrix.needsUpdate = true; if (parts.instanceColor) parts.instanceColor.needsUpdate = true; }
  $('t1').textContent = f.title || ''; $('t2').textContent = f.subtitle || ''; $('t3').textContent = f.tech || '';
  $('tag').textContent = f.tag || ''; $('tag').style.display = f.tag ? 'block' : 'none';
  $('leg').style.display = (f.ground || f.particles || f.tubes) ? 'block' : 'none';
  $('legm').textContent = `soit 0 à ${(VMAX * f.uref).toFixed(1)} m/s (Uref = ${f.uref} m/s à 10 m, Es Sénia)`;
  $('sub').textContent = f.sub || '';
  r.render(sc, cam); return true;
};
window.ready = true;
</script></body></html>
