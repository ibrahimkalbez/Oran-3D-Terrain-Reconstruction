<body><div id="bar"></div><div id="lab"></div><div id="sig">ORAN 3D — fichier brahim ib9a — maquette blanche — relief Copernicus</div>

<div id="leg"><b style="background:#E30613"></b>Grandes tours &nbsp;&nbsp;<b></b>Université USTO-MB &nbsp;&nbsp;<i></i>Parcours / tram &nbsp;&nbsp;<i style="background:#7a7a75;height:2px"></i>Courbes 10 / 50 m</div>
<script type="module">
import * as THREE from 'three';
import {LineSegments2} from 'three/addons/lines/LineSegments2.js';
import {LineSegmentsGeometry} from 'three/addons/lines/LineSegmentsGeometry.js';
import {LineMaterial} from 'three/addons/lines/LineMaterial.js';
const W=1280,H=720;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.05; document.body.appendChild(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xf3f3f1); scene.fog=new THREE.Fog(0xf3f3f1,2000,6800);
const cam=new THREE.PerspectiveCamera(42,W/H,3,15000);

sun.shadow.bias=-0.0004; sun.shadow.normalBias=1.2; scene.add(sun); scene.add(sun.target);
async function bin(u){return new Float32Array(await (await fetch(u)).arrayBuffer());}
function mesh(pos,color,shadow=true){const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.computeVertexNormals();
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:0.95,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:1}));
 m.castShadow=shadow; m.receiveShadow=true; scene.add(m); return m;}
mesh(await bin('terrain_pos.bin'),0xe8e8e5);
const rd=mesh(await bin('road_pos.bin'),0xd3d3cf,false); rd.material.polygonOffsetFactor=-2;
mesh(await bin('bld_pos.bin'),0xffffff);
mesh(await bin('bldt_pos.bin'),0xE8463E);

for(const [f,w,col] of [['cont10_pos.bin',1.6,0x7d7d78],['cont50_pos.bin',2.6,0x4f4f4a],['lines_campus_pos.bin',4.0,0xE30613],['lines_tours_pos.bin',3.5,0xE30613],['lines_route_pos.bin',5.0,0xE30613]]){

window.renderFrame=(i)=>{cam.position.set(...S.cam[i]); cam.lookAt(...S.tgt[i]);
 let lab=''; for(const [a,b,n] of S.labels) if(i>=a&&i<b) lab=n; document.getElementById('lab').textContent=lab;

 r.render(scene,cam); return true;};
window.ready=true;
</script></body></html>
